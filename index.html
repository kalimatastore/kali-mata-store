<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KALI MATA STORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: white;
    }

    .hero h2 {
      font-size: 28px;
    }

    .hero p {
      margin: 15px 0;
      color: #555;
    }

    .shop-btn {
      display: inline-block;
      padding: 12px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .products {
      padding: 30px 15px;
      text-align: center;
    }

    .products h2 {
      margin-bottom: 20px;
    }

    .product-box {
      max-width: 350px;
      margin: 15px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 10px #ccc;
    }

    .product-image {
      width: 100%;
      height: 220px;
      background: #ddd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .product-box h3 {
      margin-top: 15px;
    }

    .price {
      color: green;
      font-size: 22px;
      margin: 10px;
    }

    .order-btn {
      display: inline-block;
      padding: 12px 20px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ KALI MATA STORE</h1>
  <p>Fashion For Everyone</p>
</header>

<section class="hero">
  <h2>New Fashion Collection 👕👗</h2>
  <p>ভালো মানের জামাকাপড় সাশ্রয়ী দামে</p>
  <a class="shop-btn" href="#products">Shop Now</a>
</section>

<section class="products" id="products">

  <h2>আমাদের পণ্য</h2>

  <div class="product-box">
    <div class="product-image">👕</div>
    <h3>Stylish Men's T-Shirt</h3>
    <p class="price">₹499</p>
    <a class="order-btn" href="#">Order Now</a>
  </div>

  <div class="product-box">
    <div class="product-image">👗</div>
    <h3>Beautiful Women's Dress</h3>
    <p class="price">₹799</p>
    <a class="order-btn" href="#">Order Now</a>
  </div>

</section>

<footer>
  <h3>KALI MATA STORE</h3>
  <p>Contact us for orders</p>
</footer>

</body>
</html>
